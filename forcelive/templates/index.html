<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FORCE Live</title>

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

  <!-- pinned versions: cached by the browser, no surprise breaking upgrades -->
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script defer src="{{ url_for('static', filename='js/main.js') }}"></script>
</head>

<body>
  <div id="container">
    <div id="map"></div>

    <div id="info-panel">
      <h2>Click on the map to select location</h2>

      <div class="row">
        <span><strong>Latitude:</strong> <span id="lat"></span></span>
        <span><strong>Longitude:</strong> <span id="lng"></span></span>
        <span><strong>Tile:</strong> <span id="tile"></span></span>
      </div>

      <div class="row">
        <label><strong>Start date:</strong> <input id="startDate" type="date" value="2025-01-01"></label>
        <label><strong>End date:</strong> <input id="endDate" type="date" value="2025-05-01"></label>
      </div>

      <p><strong>Sensors:</strong></p>
      <div id="sGroups">
        <label><input type="checkbox" name="selectedSensors" value="LND04" checked>Landsat 4</label>
        <label><input type="checkbox" name="selectedSensors" value="LND05" checked>Landsat 5</label>
        <label><input type="checkbox" name="selectedSensors" value="LND07" checked>Landsat 7</label>
        <label><input type="checkbox" name="selectedSensors" value="LND08" checked>Landsat 8</label>
        <label><input type="checkbox" name="selectedSensors" value="LND09" checked>Landsat 9</label><br>
        <label><input type="checkbox" name="selectedSensors" value="SEN2A" checked>Sentinel-2A</label>
        <label><input type="checkbox" name="selectedSensors" value="SEN2B" checked>Sentinel-2B</label>
        <label><input type="checkbox" name="selectedSensors" value="SEN2C" checked>Sentinel-2C</label>
      </div>

      <div class="row">
        <label for="Bands"><strong>Band:</strong>
          <select name="Bands" id="Bands">
            <option value="BLUE">Blue</option>
            <option value="GREEN">Green</option>
            <option value="RED">Red</option>
            <option value="NIR">Near infrared</option>
            <option value="SWIR1">Swir1</option>
            <option value="SWIR2">Swir2</option>
            <option value="NDVI" selected>NDVI</option>
          </select>
        </label>

        <span><strong>Cloud mask:</strong>
          <label><input type="radio" name="cloudOption" value="0" checked> Default</label>
          <label><input type="radio" name="cloudOption" value="1"> Aggressive</label>
        </span>

        <label for="lineMode"><strong>Line:</strong>
          <select id="lineMode" title="How the line through the observations is drawn (applied instantly, no re-extraction)">
            <option value="linear" selected>Linear interpolation</option>
            <option value="spline">Spline (monotone cubic)</option>
            <option value="movavg">Moving average (5 obs.)</option>
            <option value="savgol">Savitzky–Golay (7 obs., quadratic)</option>
            <option value="harmBasic">Harmonic basic (1 harmonic + trend)</option>
            <option value="harmAdvanced">Harmonic advanced (2 harmonics + trend)</option>
            <option value="harmFull">Harmonic full (3 harmonics + trend)</option>
            <option value="none">No line</option>
          </select>
        </label>
      </div>

      <div class="row">
        <button id="stopButton" disabled title="Stop the running data extraction">Stop</button>
      </div>

      <div class="row">
        <button id="getData">View time series</button>
        <button class="copybutton" id="copyXbutton" disabled>Copy dates array</button>
        <button class="copybutton" id="copyYbutton" disabled>Copy reflectance array</button>
        <button class="copybutton" id="csvButton" disabled>Download CSV</button>
      </div>

      <div id="progressWrap" aria-hidden="true"><div id="progressBar"></div></div>
      <p id="prog" aria-live="polite"></p>

      <div id="chartWrap" hidden><canvas id="myChart"></canvas></div>
    </div>
  </div>
</body>
</html>
